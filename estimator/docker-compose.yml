# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override REDIS_URL for the in-network Redis service. The .env value
    # (redis://localhost:6379) is meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://estimator:estimator@postgres:5432/estimator

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image. Tests too, so we can
    # run `pytest` against the live container during development.
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./query_examples.py:/app/query_examples.py
      - ./data:/app/data

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack bundles the RediSearch + RedisJSON modules that redisvl uses
    # to do vector similarity queries for the semantic cache. The vanilla
    # ``redis:7-alpine`` image does NOT ship these modules.
    image: redis/redis-stack:7.4.0-v0
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI (handy during the live demo)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    # Official Postgres 16 image with the ``vector`` extension precompiled.
    # The extension itself is enabled by the first Alembic migration.
    image: pgvector/pgvector:pg16
    container_name: estimator-postgres
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      # Host port is overridable (POSTGRES_PORT=5433) when 5432 is already taken.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
