[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de software basado en LLM con arquitectura CAG (contexto estatico en el prompt)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]
